# sid-image — build and publish SID-IT-712's OpenNebula CSI image.
#
# This fork carries ONE change on top of upstream: the stuck-attachment
# reconciler only reconciles VolumeAttachments that belong to this driver
# (branch fix/reconciler-driver-filter). Without it the reconciler deletes other
# CSI drivers' VolumeAttachments; see SID-FORK.md.
#
# @gotcha: tags are `sid-v<upstream>-<n>` (e.g. sid-v0.2.0-1), NEVER `v*.*.*`.
#   Upstream's release-csi.yaml fires on `v*.*.*` and would try to push to
#   ghcr.io/opennebula, publish charts to our gh-pages and cut a release.
# @gotcha: our deployment tooling trusts EVERY image in the repository below to
#   carry the filter, and lets only images from it run the reconciler. That is
#   why this workflow refuses to publish without the filter and its regression
#   test — keep both guards, or that trust becomes false.
name: sid-image

on:
  push:
    tags: ["sid-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (must start with sid-v)"
        required: true

permissions:
  contents: read

concurrency:
  group: sid-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sid-it-712/opennebula-csi

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in
            sid-v*) ;;
            *) echo "::error::tag '$tag' must start with sid-v"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish without the driver filter
        run: |
          set -euo pipefail
          f=pkg/csi/driver/attachment_reconciler.go
          grep -qF 'strings.TrimSpace(pv.Spec.CSI.Driver) != driverName' "$f" \
            || { echo "::error::$f has no driver filter — refusing to publish to $IMAGE"; exit 1; }
          echo "driver filter present in $f"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The filter being present is not enough: prove it still does its job.
      - name: Regression test — a foreign driver's VolumeAttachment survives
        run: |
          set -euo pipefail
          go test ./pkg/csi/driver/ -count=1 \
            -run 'TestAttachmentReconciler(LeavesForeignDriverVolumeAttachment|HonoursCustomDriverName|DeletesStaleVolumeAttachment)$' -v

      - name: Full test suite
        run: go test ./... -count=1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: opennebula-csi
          # amd64 only for now; add linux/arm64 when a cluster needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.tag.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.base.name=ghcr.io/opennebula/opennebula-csi
