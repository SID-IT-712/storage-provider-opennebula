# secret-scan — gitleaks over this repo's git history (the SID-IT-712 baseline).
#
# @gotcha: this is an INLINE copy of the organization's shared secret-scan
#   action, not a `uses:` of it. That action lives in a PRIVATE repository, and
#   GitHub never lets a PUBLIC repository resolve an action from a private one,
#   whatever the "organization" access setting says. This fork is public.
# @link: keep GITLEAKS_VERSION and both sha256 values in step with the shared
#   action — bump them together, from that source, never from gitleaks' own
#   checksums.txt.
name: secret-scan

on:
  pull_request:
  push:
    branches: [sid/release]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: `gitleaks git` on a shallow clone sees only the tip, and a
      # leak a few commits back would pass unseen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksummed)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) plat=linux_x64 ;;
            aarch64|arm64) plat=linux_arm64 ;;
            *) echo "::error::unsupported runner arch: $arch"; exit 1 ;;
          esac
          case "$plat" in
            linux_x64)   sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            linux_arm64) sha256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
          esac
          file="gitleaks_${GITLEAKS_VERSION}_${plat}.tar.gz"
          tmp="$(mktemp -d)"
          curl -sSLf -o "$tmp/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "$sha256  $tmp/$file" | sha256sum -c -
          tar -xzf "$tmp/$file" -C "$tmp" gitleaks
          chmod +x "$tmp/gitleaks"
          echo "$tmp" >> "$GITHUB_PATH"

      - name: Run gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=(git --redact --exit-code 1 -v)
          # A PR's test-merge commit: HEAD^1..HEAD is exactly what the PR adds.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            args+=(--log-opts="HEAD^1..HEAD")
          elif [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            args+=(--log-opts="$BASE...HEAD")
          # A push: only what it added. A brand-new branch (all-zeros before) falls
          # through to a full-history scan.
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            args+=(--log-opts="$BEFORE..HEAD")
          else
            echo "::notice::secret-scan: no PR or push range detected, scanning full history"
          fi
          gitleaks "${args[@]}" .
