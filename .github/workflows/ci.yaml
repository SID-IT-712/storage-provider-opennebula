# ci — lint and unit tests for the SID fork, on the in-cluster runner pool.
# @why: GitHub-hosted runners are refused by billing in this org
#   (SID-IT-712/cca-claude-code-helm-chart#457), so every job targets the pool.
# @gotcha: the pool runners have no `make`, so the steps run the Makefile's
#   `lint` / `test` commands directly. Keep them in step with the Makefile
#   (GOLANGCI_LINT_VERSION, test flags).
name: ci

on:
  pull_request:
    branches: [sid/release]
  push:
    branches: [sid/release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, sid-cluster]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # @gotcha: the post-step cache save (tar) hung 11 min on the pool and
          #   was cancelled by the job timeout; the cold build is ~7 min, accepted.
          cache: false
      # @why: upstream code carries 63 pre-existing findings (errcheck,
      #   staticcheck, unused), so a full `make lint` is red on day one. Gate on
      #   findings the change itself introduces; clear the backlog separately and
      #   then drop --new-from-rev.
      - name: golangci-lint on new code (version from Makefile)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          echo "linting changes since $base"
          v="$(sed -n 's/^GOLANGCI_LINT_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile)"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${v}"
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev="$base"

  test:
    name: test
    runs-on: [self-hosted, sid-cluster]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # @gotcha: the post-step cache save (tar) hung 11 min on the pool and
          #   was cancelled by the job timeout; the cold build is ~7 min, accepted.
          cache: false
      - run: go test ./... -v -count=1
